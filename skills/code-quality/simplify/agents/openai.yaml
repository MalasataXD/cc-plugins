interface:
  display_name: "Simplify"
  short_description: "Simplify and refine code for clarity, consistency, and maintainability while preserving exact functionality. Triggers when the user asks to simplify, clean up, tidy, refine, or improve the readability of code, or to apply project standards to recent changes. Focuses on recently modified code unless told otherwise. Prefers explicit, readable code over clever or overly compact code."
